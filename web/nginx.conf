server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    # your domain in the two lines above, and the published port below
    # plain http on this port: send it to https
    error_page 497 =301 https://$host:8088$request_uri;

    root /usr/share/nginx/html;
    sendfile on;
    tcp_nopush on;

    location /maps/ {
        alias /data/maps/;
        autoindex on;
        autoindex_exact_size off;
    }
    location = /maps/report.tsv {
        alias /data/maps/report.tsv;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control no-cache;
    }
    location /install/ {
        add_header Cache-Control no-cache;
    }
}
