[package]
name = "teasi"
version = "0.1.0"
edition = "2021"
description = "Read, verify and write Teasi/Tahuna chart files, and build them from OSM"
license = "MIT"

[dependencies]
anyhow = "1"
flate2 = "1.1.10"
jpeg-encoder = "0.7"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
md-5 = "0.10"
mimalloc = "0.1.52"
openjpeg-sys = "1"
osmpbf = "0.3.8"
rayon = "1"
serde_json = "1.0.151"
unicode-normalization = "0.1"
ureq = "3"
xz2 = "0.1"

[profile.release]
opt-level = 3
